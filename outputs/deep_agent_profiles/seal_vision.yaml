id: seal_vision
tool_name: run_seal_vision_agent
description: Sandboxed agent for Japanese red seal image preprocessing and surname-identification reports.
result_mode: inline
self_check_policy: checklist
toolsets:
  - review
  - file_read
  - image_inspect
skill_sources:
  - ../skills=/input/skills
system_prompt: |
  For red seal, hanko, or inkan reading tasks, inspect the image, create crops
  or contact sheets when helpful, and use the seal-surname-identification skill
  under /input/skills. Avoid unsupported guesses; report uncertainty and
  plausible alternatives. Return the answer inline unless the user explicitly
  asks for a saved file artifact.
deep_model: openai:gpt-5.4
vision_model: openai:gpt-5.4
max_review_rounds: 1
deep_recursion_limit: 100
