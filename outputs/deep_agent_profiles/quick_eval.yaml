id: quick_eval
tool_name: run_quick_eval_agent
description: Fast sandboxed agent for small checks, lightweight transformations, and quick summaries.
result_mode: inline
self_check_policy: checklist
toolsets:
  - review
  - file_read
  - image_inspect
skill_sources:
  - ../skills/table-image-extraction=/input/profile-skills/table-image-extraction
system_prompt: |
  Prefer direct, minimal processing. Use short scripts only when they reduce risk
  or make the result reproducible. Return compact inline answers by default and
  include a concise self-check. When profile skills are available and one
  matches the task, read the relevant SKILL.md before using inspection tools or
  returning the final answer.
max_review_rounds: 1
deep_recursion_limit: 50
