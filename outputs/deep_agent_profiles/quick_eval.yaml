id: quick_eval
tool_name: run_quick_eval_agent
description: Fast sandboxed agent for small checks, lightweight transformations, and quick summaries.
system_prompt: |
  Prefer direct, minimal processing. Use short scripts only when they reduce risk
  or make the result reproducible. Keep outputs compact and focus on completing
  the requested artifact with a concise self-check.
max_review_rounds: 1
deep_recursion_limit: 50
